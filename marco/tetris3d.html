<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tetris 3D</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a1a; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden; height: 100vh; user-select: none;
  }
  #game-container {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; gap: 24px; padding: 16px;
  }
  #board-container { position: relative; flex-shrink: 0; }
  #board { display: block; border-radius: 4px; cursor: grab; }
  #board:active { cursor: grabbing; }

  .side-panel {
    display: flex; flex-direction: column; gap: 14px; min-width: 140px;
    background: rgba(255,255,255,.03); border-radius: 12px; padding: 16px;
    backdrop-filter: blur(4px);
  }
  .panel-box {
    text-align: center;
  }
  .panel-box h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
    color: #666; margin-bottom: 8px; font-weight: 600;
  }
  .panel-box canvas {
    display: block; margin: 0 auto; border-radius: 4px;
    background: rgba(0,0,0,.3);
  }
  .stat-row {
    display: flex; justify-content: space-between; padding: 4px 0;
    font-size: 13px; color: #888;
  }
  .stat-row span:last-child { color: #0ff; font-weight: 700; font-variant-numeric: tabular-nums; }
  .controls { font-size: 11px; color: #555; line-height: 1.7; margin-top: 4px; }
  .controls kbd {
    background: rgba(255,255,255,.08); color: #aaa; padding: 1px 5px;
    border-radius: 3px; font-size: 10px; font-family: inherit;
  }
  #game-over {
    position: absolute; inset: 0; background: rgba(0,0,0,.7);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; backdrop-filter: blur(4px);
  }
  #game-over.show { display: flex; }
  #game-over h2 { font-size: 32px; color: #f44; margin-bottom: 4px; font-weight: 800; letter-spacing: 2px; }
  #game-over p { font-size: 14px; color: #999; margin-bottom: 20px; }
  #game-over button {
    padding: 10px 32px; font-size: 15px; cursor: pointer; border: none;
    border-radius: 8px; background: linear-gradient(135deg, #0ff, #06f);
    color: #fff; font-weight: 700; letter-spacing: .5px; transition: transform .15s;
  }
  #game-over button:hover { transform: scale(1.05); }

  .touch-controls {
    display: none; gap: 6px; margin-top: 8px; justify-content: center; flex-wrap: wrap;
  }
  @media (pointer: coarse) {
    #game-container {
      flex-direction: column; height: auto; min-height: 100vh;
      padding: 12px; gap: 12px;
    }
    #board { width: 100% !important; height: auto !important; max-width: 360px; }
    .touch-controls { display: flex; }
  }

  @media (max-width: 600px) {
    .side-panel { flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 12px; gap: 8px; min-width: auto; }
    .panel-box { flex: 1; min-width: 80px; }
    .stat-row { font-size: 11px; }
  }

  #loading {
    position: fixed; inset: 0; background: #0a0a1a; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 16px; letter-spacing: 1px;
  }
  .touch-btn {
    width: 52px; height: 52px; font-size: 20px; border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; background: rgba(255,255,255,.05); color: #ccc;
    cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .touch-btn:active { background: rgba(255,255,255,.15); }
  .touch-btn.wide { width: 72px; }
  .touch-row { display: flex; gap: 6px; }
</style>
</head>
<body>

<div id="loading">Loading&hellip;</div>

<div id="game-container">
  <div id="board-container">
    <canvas id="board"></canvas>
    <div id="game-over">
      <h2>GAME OVER</h2>
      <p>Score: <span id="final-score">0</span></p>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="next" width="100" height="100"></canvas>
    </div>
    <div class="panel-box">
      <h3>Hold</h3>
      <canvas id="hold" width="100" height="100"></canvas>
    </div>
    <div class="panel-box">
      <div class="stat-row">Score <span id="score">0</span></div>
      <div class="stat-row">Lines <span id="lines">0</span></div>
      <div class="stat-row">Level <span id="level">1</span></div>
    </div>
    <div class="panel-box controls">
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &middot; <kbd>&uarr;</kbd> rotate<br/>
      <kbd>&darr;</kbd> soft &middot; <kbd>Space</kbd> hard &middot; <kbd>C</kbd> hold<br/>
      <span style="color:#444">Drag to orbit</span>
    </div>

    <div class="touch-controls">
      <div class="touch-row">
        <button class="touch-btn" ontouchstart="window.holdPiece()">H</button>
        <button class="touch-btn" ontouchstart="window.movePiece(-1)">&#9664;</button>
        <button class="touch-btn" ontouchstart="window.rotateP()">&#8631;</button>
        <button class="touch-btn" ontouchstart="window.movePiece(1)">&#9654;</button>
        <button class="touch-btn" ontouchstart="window.hardDropP()">&#9660;</button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Constants ---
const COLS = 10, ROWS = 20;
const PIECE_NAMES = ['I','O','T','S','Z','J','L'];
const PIECES = {
  I: { shape: [[1,1,1,1]], color: '#0ff' },
  O: { shape: [[1,1],[1,1]], color: '#ff0' },
  T: { shape: [[0,1,0],[1,1,1]], color: '#a0f' },
  S: { shape: [[0,1,1],[1,1,0]], color: '#0f0' },
  Z: { shape: [[1,1,0],[0,1,1]], color: '#f00' },
  J: { shape: [[1,0,0],[1,1,1]], color: '#00f' },
  L: { shape: [[0,0,1],[1,1,1]], color: '#f80' },
};
const SPEEDS = [800,720,630,550,470,380,300,220,150,100,80,60,50];

// --- DOM refs ---
const $ = id => document.getElementById(id);
const boardCanvas = $('board');
const nextCanvas = $('next'), nextCtx = nextCanvas.getContext('2d');
const holdCanvas = $('hold'), holdCtx = holdCanvas.getContext('2d');

// --- Game state ---
let grid, current, nextPiece, heldPiece, score, lines, level, gameOver, canHold;
let lastDrop;

// --- Three.js setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(14, 16, 14);
camera.lookAt(0, 9, 0);

const renderer = new THREE.WebGLRenderer({
  canvas: boardCanvas,
  antialias: true,
  alpha: false,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 35;
controls.maxPolarAngle = Math.PI / 2.1;
controls.update();

function resizeRenderer() {
  const container = boardCanvas.parentElement;
  const maxW = Math.min(container.clientWidth, 480);
  const aspect = 10 / 20;
  const w = maxW;
  const h = w / aspect;
  boardCanvas.style.width = w + 'px';
  boardCanvas.style.height = h + 'px';
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// --- Lights ---
const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
scene.add(ambientLight);

const envLight = new THREE.DirectionalLight(0x8888ff, 0.4);
envLight.position.set(-5, 10, 10);
scene.add(envLight);

const mainLight = new THREE.DirectionalLight(0xffeedd, 2.0);
mainLight.position.set(8, 20, 10);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
mainLight.shadow.camera.near = 0.5;
mainLight.shadow.camera.far = 40;
mainLight.shadow.camera.left = -12;
mainLight.shadow.camera.right = 12;
mainLight.shadow.camera.top = 24;
mainLight.shadow.camera.bottom = -2;
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
fillLight.position.set(-8, 5, -5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
rimLight.position.set(0, 0, 12);
scene.add(rimLight);

// --- Board 3D ---
const boardGroup = new THREE.Group();
scene.add(boardGroup);

function makeWall(w, h, d, color, opacity) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.MeshPhongMaterial({
    color, transparent: true, opacity, depthWrite: false,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.receiveShadow = true;
  return mesh;
}

// Back wall
const backWall = makeWall(10.6, 20.6, 0.08, 0x222244, 0.5);
backWall.position.set(0, 10, -0.6);
boardGroup.add(backWall);

// Floor
const floor = makeWall(10.6, 0.08, 1.2, 0x1a1a3a, 0.8);
floor.position.set(0, -0.5, 0);
floor.receiveShadow = true;
boardGroup.add(floor);

// Side walls
const lWall = makeWall(0.08, 20.6, 1.2, 0x222244, 0.3);
lWall.position.set(-5.3, 10, 0);
boardGroup.add(lWall);
const rWall = makeWall(0.08, 20.6, 1.2, 0x222244, 0.3);
rWall.position.set(5.3, 10, 0);
boardGroup.add(rWall);

// Grid floor lines
const gridLineMat = new THREE.LineBasicMaterial({ color: 0x222244, transparent: true, opacity: 0.3 });
for (let c = 0; c <= COLS; c++) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(c - 5, -0.45, 0), new THREE.Vector3(c - 5, -0.45, 0.5)
  ]);
  boardGroup.add(new THREE.Line(g, gridLineMat));
}
for (let r = 0; r <= ROWS; r++) {
  const g = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-5, r - 0.5 + 1, 0), new THREE.Vector3(5, r - 0.5 + 1, 0)
  ]);
  const line = new THREE.Line(g, gridLineMat);
  line.position.z = 0.5;
  boardGroup.add(line);
}

// --- Block meshes ---
const blockMeshes = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
const blockGroup = new THREE.Group();
boardGroup.add(blockGroup);

function createBlockMesh(colorHex) {
  const c = new THREE.Color(colorHex);
  const size = 0.92;
  const geo = new THREE.BoxGeometry(size, size, size);
  const mat = new THREE.MeshPhongMaterial({
    color: c,
    emissive: c.clone().multiplyScalar(0.2),
    emissiveIntensity: 0.15,
    shininess: 40,
    specular: new THREE.Color(0x444466),
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(size, size, size));
  const edgeMat = new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.08,
  });
  const edges = new THREE.LineSegments(edgeGeo, edgeMat);
  mesh.add(edges);
  return mesh;
}

function createGhostBlock(colorHex) {
  const c = new THREE.Color(colorHex);
  const geo = new THREE.BoxGeometry(0.92, 0.92, 0.92);
  const mat = new THREE.MeshPhongMaterial({
    color: c, transparent: true, opacity: 0.12,
    depthWrite: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(0.92, 0.92, 0.92));
  const edgeMat = new THREE.LineBasicMaterial({
    color: c, transparent: true, opacity: 0.25,
  });
  mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));
  return mesh;
}

function blockPos(c, r) {
  return new THREE.Vector3(c - 4.5, r + 0.5, 0);
}

function syncGridTo3D() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] && !blockMeshes[r][c]) {
        const mesh = createBlockMesh(grid[r][c]);
        mesh.position.copy(blockPos(c, r));
        blockMeshes[r][c] = mesh;
        blockGroup.add(mesh);
      } else if (!grid[r][c] && blockMeshes[r][c]) {
        blockGroup.remove(blockMeshes[r][c]);
        blockMeshes[r][c] = null;
      }
    }
  }
}

// --- Current piece 3D ---
const currentGroup = new THREE.Group();
boardGroup.add(currentGroup);
const ghostGroup = new THREE.Group();
boardGroup.add(ghostGroup);

function updatePiece3D() {
  while (currentGroup.children.length) currentGroup.remove(currentGroup.children[0]);
  while (ghostGroup.children.length) ghostGroup.remove(ghostGroup.children[0]);
  if (!current || gameOver) return;

  const { shape, x, y, color } = current;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[0].length; c++) {
      if (shape[r][c]) {
        const b = createBlockMesh(color);
        b.position.copy(blockPos(x + c, y + r));
        currentGroup.add(b);
      }
    }
  }

  const gy = ghostY();
  if (gy !== y) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[0].length; c++) {
        if (shape[r][c]) {
          const b = createGhostBlock(color);
          b.position.copy(blockPos(x + c, gy + r));
          ghostGroup.add(b);
        }
      }
    }
  }
}

// --- Game logic ---
function createGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function randomPiece() {
  const name = PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)];
  const p = PIECES[name];
  return {
    name,
    shape: p.shape.map(r => [...r]),
    color: p.color,
    x: Math.floor((COLS - p.shape[0].length) / 2),
    y: 0,
  };
}

function rotateMatrix(m) {
  return m[0].map((_, i) => m.map(r => r[i]).reverse());
}

function collides(g, shape, x, y) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[0].length; c++)
      if (shape[r][c] && (y + r >= ROWS || y + r < 0 || x + c < 0 || x + c >= COLS || g[y + r][x + c]))
        return true;
  return false;
}

function lockPiece() {
  const { shape, x, y, color } = current;
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[0].length; c++)
      if (shape[r][c]) grid[y + r][x + c] = color;
  syncGridTo3D();
  clearLines();
  canHold = true;
  spawnPiece(nextPiece);
  nextPiece = randomPiece();
  updatePiece3D();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(c => c)) {
      grid.splice(r, 1);
      grid.unshift(Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800];
    score += (pts[cleared] || 0) * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    updateStats();
    syncGridTo3D();
  }
}

function spawnPiece(piece) {
  current = {
    ...piece,
    shape: piece.shape.map(r => [...r]),
    x: Math.floor((COLS - piece.shape[0].length) / 2),
    y: 0,
  };
  if (collides(grid, current.shape, current.x, current.y)) {
    gameOver = true;
    $('game-over').classList.add('show');
    $('final-score').textContent = score;
  }
}

function movePiece(dx) {
  if (gameOver) return;
  if (!collides(grid, current.shape, current.x + dx, current.y)) {
    current.x += dx;
    updatePiece3D();
  }
}

function rotatePiece() {
  if (gameOver) return;
  const r = rotateMatrix(current.shape);
  let nx = current.x, ny = current.y;
  if (!collides(grid, r, nx, ny)) {
    current.shape = r;
    updatePiece3D();
    return;
  }
  for (const kick of [[-1,0],[1,0],[-2,0],[2,0],[0,-1]]) {
    nx = current.x + kick[0]; ny = current.y + kick[1];
    if (!collides(grid, r, nx, ny)) {
      current.shape = r;
      current.x = nx; current.y = ny;
      updatePiece3D();
      return;
    }
  }
}

function hardDrop() {
  if (gameOver) return;
  while (!collides(grid, current.shape, current.x, current.y + 1)) current.y++;
  lockPiece();
  updatePiece3D();
  updatePreview();
}

function softDrop() {
  if (gameOver) return false;
  if (!collides(grid, current.shape, current.x, current.y + 1)) {
    current.y++;
    updatePiece3D();
    return true;
  }
  return false;
}

function holdPiece() {
  if (gameOver || !canHold) return;
  canHold = false;
  if (!heldPiece) {
    heldPiece = { name: current.name, color: current.color, shape: current.shape.map(r => [...r]) };
    spawnPiece(nextPiece);
    nextPiece = randomPiece();
  } else {
    const tmp = { name: heldPiece.name, color: heldPiece.color, shape: heldPiece.shape.map(r => [...r]) };
    heldPiece = { name: current.name, color: current.color, shape: current.shape.map(r => [...r]) };
    spawnPiece(tmp);
  }
  updatePiece3D();
  updatePreview();
}

function ghostY() {
  let gy = current.y;
  while (!collides(grid, current.shape, current.x, gy + 1)) gy++;
  return gy;
}

// --- Preview 2D ---
function drawPreview(ctx, piece, dim, alpha) {
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.clearRect(0, 0, dim, dim);
  if (!piece) return;
  const s = piece.shape;
  const bs = 24;
  const ox = (dim - s[0].length * bs) / 2;
  const oy = (dim - s.length * bs) / 2;
  for (let r = 0; r < s.length; r++) {
    for (let c = 0; c < s[0].length; c++) {
      if (s[r][c]) {
        const a = alpha !== undefined ? alpha : 1;
        ctx.globalAlpha = a;
        ctx.fillStyle = piece.color;
        ctx.shadowColor = piece.color;
        ctx.shadowBlur = 4;
        const x = ox + c * bs, y = oy + r * bs;
        ctx.fillRect(x, y, bs - 1, bs - 1);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.15)';
        ctx.fillRect(x + 2, y + 2, 6, 6);
        ctx.globalAlpha = 1;
      }
    }
  }
}

function updatePreview() {
  drawPreview(nextCtx, nextPiece, 100);
  drawPreview(holdCtx, heldPiece, 100, canHold ? 1 : 0.4);
}

function updateStats() {
  $('score').textContent = score;
  $('lines').textContent = lines;
  $('level').textContent = level;
}

// --- Game loop ---
function tick() {
  if (gameOver) return;
  if (!softDrop()) lockPiece();
  updatePreview();
  lastDrop = performance.now();
}

let gameLoopId;

function gameStep(time) {
  if (!gameOver) {
    const elapsed = time - lastDrop;
    const speed = SPEEDS[Math.min(level - 1, SPEEDS.length - 1)];
    if (elapsed >= speed) tick();
  }
  controls.update();
  renderer.render(scene, camera);
  gameLoopId = requestAnimationFrame(gameStep);
}

function startGame() {
  // Clear 3D blocks
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      if (blockMeshes[r][c]) {
        blockGroup.remove(blockMeshes[r][c]);
        blockMeshes[r][c] = null;
      }
    }
  while (currentGroup.children.length) currentGroup.remove(currentGroup.children[0]);
  while (ghostGroup.children.length) ghostGroup.remove(ghostGroup.children[0]);

  grid = createGrid();
  score = 0; lines = 0; level = 1; gameOver = false; canHold = true;
  heldPiece = null;
  $('game-over').classList.remove('show');
  nextPiece = randomPiece();
  spawnPiece(randomPiece());
  updatePiece3D();
  updatePreview();
  updateStats();
  lastDrop = performance.now();
}

// --- Input ---
document.addEventListener('keydown', e => {
  if (gameOver) {
    if (e.key === 'Enter') { startGame(); return; }
    return;
  }
  switch (e.key) {
    case 'ArrowLeft':  movePiece(-1); e.preventDefault(); break;
    case 'ArrowRight': movePiece(1);  e.preventDefault(); break;
    case 'ArrowDown':  softDrop(); lastDrop = performance.now(); e.preventDefault(); break;
    case 'ArrowUp':    rotatePiece(); e.preventDefault(); break;
    case ' ':          hardDrop(); e.preventDefault(); break;
    case 'c': case 'C': holdPiece(); break;
  }
  if (!gameOver) updatePreview();
});

$('restart-btn').addEventListener('click', startGame);

// Expose for touch controls
window.movePiece = movePiece;
window.rotateP = rotatePiece;
window.hardDropP = hardDrop;
window.holdPiece = holdPiece;

// --- Init ---
window.addEventListener('resize', resizeRenderer);
resizeRenderer();
$('loading').style.display = 'none';
startGame();
requestAnimationFrame(gameStep);
</script>
</body>
</html>
