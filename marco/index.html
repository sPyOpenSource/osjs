<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tetris</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .game-wrapper {
    display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap;
    padding: 20px; justify-content: center;
  }
  .board-container { position: relative; }
  #board {
    display: block; border: 2px solid #444; background: #0f0f1a;
    box-shadow: 0 0 20px rgba(0,0,0,.5);
  }
  .side-panel { display: flex; flex-direction: column; gap: 16px; min-width: 130px; }
  .panel-box {
    background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 12px;
    text-align: center;
  }
  .panel-box h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: #888; margin-bottom: 8px; }
  .panel-box canvas { display: block; margin: 0 auto; background: #0f0f1a; border: 1px solid #333; }
  .stats { font-size: 14px; line-height: 1.8; }
  .stats span { color: #0ff; font-weight: 700; }
  .controls { font-size: 12px; color: #777; line-height: 1.6; }
  .controls kbd {
    background: #333; color: #eee; padding: 1px 6px; border-radius: 3px;
    font-size: 11px;
  }
  #game-over {
    position: absolute; inset: 0; background: rgba(0,0,0,.75);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 4px;
  }
  #game-over.show { display: flex; }
  #game-over h2 { font-size: 28px; color: #f44; margin-bottom: 8px; }
  #game-over p { font-size: 14px; color: #aaa; margin-bottom: 16px; }
  #game-over button {
    padding: 10px 28px; font-size: 16px; cursor: pointer; border: none;
    border-radius: 6px; background: #0ff; color: #000; font-weight: 700;
  }
  #game-over button:hover { background: #0cc; }

  .touch-controls {
    display: none; gap: 8px; margin-top: 12px; justify-content: center; flex-wrap: wrap;
  }
  @media (pointer: coarse) {
    .game-wrapper { flex-direction: column; align-items: center; }
    .side-panel { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .touch-controls { display: flex; }
  }
  .touch-btn {
    width: 56px; height: 56px; font-size: 22px; border: none; border-radius: 10px;
    background: #16213e; color: #eee; cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .touch-btn:active { background: #1a3a6e; }
  .touch-btn.wide { width: 80px; }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="board-container">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="game-over">
      <h2>GAME OVER</h2>
      <p>Score: <span id="final-score">0</span></p>
      <button onclick="startGame()">Play Again</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="panel-box">
      <h3>Hold</h3>
      <canvas id="hold" width="120" height="120"></canvas>
    </div>
    <div class="panel-box">
      <div class="stats">
        Score<br/><span id="score">0</span><br/>
        Lines<br/><span id="lines">0</span><br/>
        Level<br/><span id="level">1</span>
      </div>
    </div>
    <div class="panel-box controls">
      <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &middot;
      <kbd>&uarr;</kbd> rotate &middot;
      <kbd>&darr;</kbd> soft drop<br/>
      <kbd>Space</kbd> hard drop &middot;
      <kbd>C</kbd> hold
    </div>
  </div>

  <div class="touch-controls">
    <button class="touch-btn" ontouchstart="holdPiece()">H</button>
    <button class="touch-btn" ontouchstart="move(-1)">&#9664;</button>
    <button class="touch-btn" ontouchstart="rotatePiece()">&#8631;</button>
    <button class="touch-btn" ontouchstart="move(1)">&#9654;</button>
    <button class="touch-btn" ontouchstart="hardDrop()">&#9660;</button>
  </div>
</div>

<script>
const COLS = 10, ROWS = 20, BLOCK = 30;
const $ = id => document.getElementById(id);
const board = $('board'), ctx = board.getContext('2d');
const nextCanvas = $('next'), nextCtx = nextCanvas.getContext('2d');
const holdCanvas = $('hold'), holdCtx = holdCanvas.getContext('2d');

const PIECES = {
  I: { shape: [[1,1,1,1]], color: '#0ff' },
  O: { shape: [[1,1],[1,1]], color: '#ff0' },
  T: { shape: [[0,1,0],[1,1,1]], color: '#a0f' },
  S: { shape: [[0,1,1],[1,1,0]], color: '#0f0' },
  Z: { shape: [[1,1,0],[0,1,1]], color: '#f00' },
  J: { shape: [[1,0,0],[1,1,1]], color: '#00f' },
  L: { shape: [[0,0,1],[1,1,1]], color: '#f80' },
};
const PIECE_NAMES = Object.keys(PIECES);

let grid, current, nextPiece, heldPiece, score, lines, level, gameOver, canHold;
let dropTimer, lastDrop;

function createGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
}

function randomPiece() {
  const name = PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)];
  const p = PIECES[name];
  return { name, shape: p.shape.map(r => [...r]), color: p.color, x: Math.floor((COLS - p.shape[0].length) / 2), y: 0 };
}

function rotateMatrix(m) {
  return m[0].map((_, i) => m.map(r => r[i]).reverse());
}

function collides(grid, shape, x, y) {
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[0].length; c++)
      if (shape[r][c] && (y + r >= ROWS || y + r < 0 || x + c < 0 || x + c >= COLS || grid[y + r][x + c]))
        return true;
  return false;
}

function lockPiece() {
  const { shape, x, y, color } = current;
  for (let r = 0; r < shape.length; r++)
    for (let c = 0; c < shape[0].length; c++)
      if (shape[r][c]) grid[y + r][x + c] = color;
  clearLines();
  canHold = true;
  spawnPiece(nextPiece);
  nextPiece = randomPiece();
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r].every(c => c)) {
      grid.splice(r, 1);
      grid.unshift(Array(COLS).fill(0));
      cleared++;
      r++;
    }
  }
  if (cleared) {
    const pts = [0, 100, 300, 500, 800];
    score += (pts[cleared] || 0) * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    updateStats();
  }
}

function spawnPiece(piece) {
  current = { ...piece, shape: piece.shape.map(r => [...r]), x: Math.floor((COLS - piece.shape[0].length) / 2), y: 0 };
  if (collides(grid, current.shape, current.x, current.y)) {
    gameOver = true;
    $('game-over').classList.add('show');
    $('final-score').textContent = score;
  }
}

function move(dx) {
  if (gameOver) return;
  if (!collides(grid, current.shape, current.x + dx, current.y)) current.x += dx;
}

function rotatePiece() {
  if (gameOver) return;
  const r = rotateMatrix(current.shape);
  let nx = current.x, ny = current.y;
  if (!collides(grid, r, nx, ny)) { current.shape = r; current.x = nx; return; }
  // Wall kicks
  for (const kick of [[-1,0],[1,0],[-2,0],[2,0],[0,-1]]) {
    nx = current.x + kick[0]; ny = current.y + kick[1];
    if (!collides(grid, r, nx, ny)) { current.shape = r; current.x = nx; current.y = ny; return; }
  }
}

function hardDrop() {
  if (gameOver) return;
  while (!collides(grid, current.shape, current.x, current.y + 1)) current.y++;
  lockPiece();
}

let softDropping = false;

function softDrop() {
  if (gameOver) return;
  if (!collides(grid, current.shape, current.x, current.y + 1)) {
    current.y++;
    return true;
  }
  return false;
}

function holdPiece() {
  if (gameOver || !canHold) return;
  canHold = false;
  if (!heldPiece) {
    heldPiece = { ...current, name: current.name, color: current.color, shape: current.shape.map(r => [...r]) };
    spawnPiece(nextPiece);
    nextPiece = randomPiece();
  } else {
    const tmp = { ...heldPiece, name: heldPiece.name, color: heldPiece.color, shape: heldPiece.shape.map(r => [...r]) };
    heldPiece = { ...current, name: current.name, color: current.color, shape: current.shape.map(r => [...r]) };
    spawnPiece(tmp);
  }
}

function ghostY() {
  let gy = current.y;
  while (!collides(grid, current.shape, current.x, gy + 1)) gy++;
  return gy;
}

function draw() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, 300, 600);

  // Grid
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) drawBlock(ctx, c, r, grid[r][c]);

  // Ghost
  if (current && !gameOver) {
    const gy = ghostY();
    if (gy !== current.y) {
      for (let r = 0; r < current.shape.length; r++)
        for (let c = 0; c < current.shape[0].length; c++)
          if (current.shape[r][c])
            drawGhost(ctx, current.x + c, gy + r, current.color);
    }
  }

  // Current
  if (current && !gameOver) {
    for (let r = 0; r < current.shape.length; r++)
      for (let c = 0; c < current.shape[0].length; c++)
        if (current.shape[r][c]) drawBlock(ctx, current.x + c, current.y + r, current.color);
  }

  // Next
  nextCtx.fillStyle = '#0f0f1a';
  nextCtx.fillRect(0, 0, 120, 120);
  if (nextPiece) {
    const s = nextPiece.shape;
    const ox = (120 - s[0].length * 30) / 2;
    const oy = (120 - s.length * 30) / 2;
    for (let r = 0; r < s.length; r++)
      for (let c = 0; c < s[0].length; c++)
        if (s[r][c]) {
          nextCtx.fillStyle = nextPiece.color;
          nextCtx.fillRect(ox + c * 30, oy + r * 30, 28, 28);
          nextCtx.fillStyle = 'rgba(255,255,255,.15)';
          nextCtx.fillRect(ox + c * 30 + 2, oy + r * 30 + 2, 10, 10);
        }
  }

  // Hold
  holdCtx.fillStyle = '#0f0f1a';
  holdCtx.fillRect(0, 0, 120, 120);
  if (heldPiece) {
    const s = heldPiece.shape;
    const ox = (120 - s[0].length * 30) / 2;
    const oy = (120 - s.length * 30) / 2;
    for (let r = 0; r < s.length; r++)
      for (let c = 0; c < s[0].length; c++)
        if (s[r][c]) {
          const a = canHold ? 1 : .5;
          holdCtx.globalAlpha = a;
          holdCtx.fillStyle = heldPiece.color;
          holdCtx.fillRect(ox + c * 30, oy + r * 30, 28, 28);
          holdCtx.fillStyle = 'rgba(255,255,255,.15)';
          holdCtx.fillRect(ox + c * 30 + 2, oy + r * 30 + 2, 10, 10);
          holdCtx.globalAlpha = 1;
        }
  }
}

function drawBlock(ctx, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * 30, y * 30, 28, 28);
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.fillRect(x * 30 + 2, y * 30 + 2, 10, 10);
}

function drawGhost(ctx, x, y, color) {
  ctx.strokeStyle = color;
  ctx.globalAlpha = .3;
  ctx.lineWidth = 2;
  ctx.strokeRect(x * 30 + 1, y * 30 + 1, 27, 27);
  ctx.globalAlpha = 1;
}

function updateStats() {
  $('score').textContent = score;
  $('lines').textContent = lines;
  $('level').textContent = level;
}

const SPEEDS = [800, 720, 630, 550, 470, 380, 300, 220, 150, 100, 80, 60, 50];

function tick() {
  if (gameOver) return;
  if (!softDrop()) lockPiece();
  draw();
}

let gameLoop, dropInterval;

function gameStep() {
  const now = performance.now();
  const elapsed = now - lastDrop;
  const speed = SPEEDS[Math.min(level - 1, SPEEDS.length - 1)];
  if (elapsed >= speed) {
    lastDrop = now;
    tick();
  }
  draw();
  requestAnimationFrame(gameStep);
}

function startGame() {
  grid = createGrid();
  score = 0; lines = 0; level = 1; gameOver = false; canHold = true;
  heldPiece = null;
  $('game-over').classList.remove('show');
  nextPiece = randomPiece();
  spawnPiece(randomPiece());
  updateStats();
  lastDrop = performance.now();
  if (gameLoop) cancelAnimationFrame(gameLoop);
  gameLoop = requestAnimationFrame(gameStep);
}

document.addEventListener('keydown', e => {
  if (gameOver && e.key === 'Enter') { startGame(); return; }
  if (gameOver) return;
  switch (e.key) {
    case 'ArrowLeft':  move(-1); e.preventDefault(); break;
    case 'ArrowRight': move(1);  e.preventDefault(); break;
    case 'ArrowDown':  softDrop(); lastDrop = performance.now(); e.preventDefault(); break;
    case 'ArrowUp':    rotatePiece(); e.preventDefault(); break;
    case ' ':          hardDrop(); e.preventDefault(); break;
    case 'c': case 'C': holdPiece(); break;
  }
  draw();
});

// Touch helpers
window.move = move;
window.rotatePiece = rotatePiece;
window.hardDrop = hardDrop;
window.holdPiece = holdPiece;

startGame();
</script>
</body>
</html>
